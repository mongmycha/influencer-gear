<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluencer Gear</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="poppins-font">
  <header>
    <!-- navbar section -->
    <nav class="nav-section">
      <h1 class="nav-titile text-color">Influencer products</h1>
      <div class="nav-links">
        <ul>
          <li class="link"><a href="" class="text-color">Home</a></li>
          <li class="link"><a href="" class="text-color">Products</a></li>
          <li class="link"><a href="" class="text-color">Sign up</a></li>
          <li class="link"><a href="" class="text-color">Log In</a></li>
        </ul>
        <div class="icons">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-solid fa-cart-shopping"></i>
        </div>

      </div>
    </nav>
    <!-- hero section -->
    <div class="hero-section">
      <!-- .hero-content>h1.hero-title+p.hero-description+btn.hero-btn -->
      <div class="hero-content">
        <h1 class="hero-title text-color">Start your Journey as Influencer</h1>
        <p class="hero-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sem <br> vestibulum sed scelerisque eros. Lectus faucibus.</p>
        <button class="hero-btn">Preebook now <i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <div class="camera">
        <img class="img-background" src="images/Circle design.svg" alt="Background image of main-camera in hero section">
        <img class="main-camera" src="images/main-camera.png" alt="main-camera image in hero section">
      </div>
    </div>
  </header>
  <main>
    <div class="logos">
      <img class="logo" src="logos/Alibaba.svg" alt="alibaba logo">
      <img class="logo" src="logos/Amazon.svg" alt="amazon logo">
      <img class="logo" src="logos/Daraz.pk Logo.svg" alt="daraz logo">
      <img class="logo" src="logos/Ebay.svg" alt="ebay logo">
      <img class="logo" src="logos/Rakuten.svg" alt="rakuten logo">
      <img class="logo" src="logos/Walmart.svg" alt="walmart logo">
      <img class="logo" src="logos/Target.svg" alt="target logo">
    </div>
  </main>
  <footer>

  </footer>
</body>

</html>
